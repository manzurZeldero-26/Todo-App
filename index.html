<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zelda TODO App - Hyrule Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Metamorphous&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <div class="main-card">
    <!-- Header Decorativo -->
    <header class="app-header">
      <div class="triforce-container" id="triforceBtn" title="¡Haz clic en la Trifuerza!">
        <svg viewBox="0 0 100 87" class="triforce-svg">
          <!-- Triángulo Superior (Poder) -->
          <polygon points="50,0 25,43.3 75,43.3" class="tri-top" />
          <!-- Triángulo Izquierdo (Sabiduría) -->
          <polygon points="25,43.3 0,86.6 50,86.6" class="tri-left" />
          <!-- Triángulo Derecho (Valor) -->
          <polygon points="75,43.3 50,86.6 100,86.6" class="tri-right" />
        </svg>
      </div>
      <h1 class="app-title">HYRULE TODO APP</h1>
      <p class="app-subtitle">Gestor de Misiones Heroicas</p>
    </header>

    <!-- Controles Superiores: Tema -->
    <div class="controls-bar">
      <button id="themeToggleBtn" class="theme-btn" aria-label="Cambiar Tema">
        🌙 Modo Oscuro
      </button>
    </div>

    <!-- Formulario de Agregar Tarea -->
    <form id="todoForm" class="todo-form" novalidate>
      <div class="input-wrapper">
        <div class="input-group">
          <input 
            type="text" 
            id="taskInput" 
            placeholder="Escribe una nueva misión..." 
            autocomplete="off"
            maxlength="150"
          >
          <button type="submit" class="btn-add" title="Agregar misión">
            <span>+</span>
          </button>
        </div>
        <div id="errorMessage" class="error-msg">A task must be provided</div>
      </div>
    </form>

    <!-- Lista de Tareas -->
    <ul id="taskList" class="task-list"></ul>

    <!-- Footer con Contadores -->
    <footer class="stats-footer">
      <div class="stat-badge total">
        <span class="stat-label">Total</span>
        <span id="totalCount" class="stat-num">0</span>
      </div>
      <div class="stat-badge completed">
        <span class="stat-label">Completadas</span>
        <span id="completedCount" class="stat-num">0</span>
      </div>
      <div class="stat-badge pending">
        <span class="stat-label">Pendientes</span>
        <span id="pendingCount" class="stat-num">0</span>
      </div>
    </footer>
  </div>

  <script src="index.js"></script>
</body>
</html>
